apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure-tutorial
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tutorial-web
  namespace: infrastructure-tutorial
data:
  index.html: |
    <!doctype html><html lang="en"><meta charset="utf-8"><title>Infrastructure tutorial</title>
    <style>body{font:18px system-ui;max-width:780px;margin:70px auto;padding:20px;background:#10212e;color:#e7f3fa}a{color:#87d9ff}li{margin:18px 0}code{background:#243b4b;padding:3px}</style>
    <h1>Infrastructure tutorial is running</h1>
    <p>This page is served by a real Pod on your local Kubernetes cluster.</p>
    <p>The GPUCluster controller starts a Temporal workflow: reserve hosts → image → join → validate.</p>
    <p>Hosts, imaging, cluster membership, and GPU checks are simulated. No physical GPUs are used.</p>
    <ul><li><a href="http://127.0.0.1:8233">Open Temporal workflows and event history</a></li>
    <li><a href="http://127.0.0.1:9080/v1/inventory">Inspect persistent mock-provider inventory</a></li></ul>
    <p>Inspect <code>GPUCluster/demo-gpu</code> in namespace <code>infrastructure-tutorial</code>.</p></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tutorial-web
  namespace: infrastructure-tutorial
spec:
  replicas: 1
  selector:
    matchLabels: {app: tutorial-web}
  template:
    metadata:
      labels: {app: tutorial-web}
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        ports: [{containerPort: 80}]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
        readinessProbe:
          httpGet: {path: /, port: 80}
        volumeMounts:
        - {name: page, mountPath: /usr/share/nginx/html, readOnly: true}
      volumes:
      - name: page
        configMap: {name: tutorial-web}
---
apiVersion: v1
kind: Service
metadata:
  name: tutorial-web
  namespace: infrastructure-tutorial
spec:
  selector: {app: tutorial-web}
  ports: [{port: 80, targetPort: 80}]
